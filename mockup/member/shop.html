<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shop — CrossFit Rheinblick</title>
<link rel="stylesheet" href="../shared/css/base.css">
<link rel="stylesheet" href="../shared/css/layout.css">
<link rel="stylesheet" href="../shared/css/components.css">
<link rel="stylesheet" href="../shared/css/member.css">
<style>
  .category-filter { display: flex; gap: 0.5rem; overflow-x: auto; margin-bottom: 1.25rem; }
  .category-filter button { flex-shrink: 0; }
</style>
</head>
<body>
<div id="page-chrome"></div>
<main class="member-content">
  <div class="container-narrow">
    <div class="page-header">
      <h1>Shop</h1>
      <a class="btn btn-secondary btn-sm" href="cart.html">🛒 Warenkorb</a>
    </div>
    <div class="category-filter" id="category-filter"></div>
    <div class="shop-grid" id="shop-mount"></div>
  </div>
</main>

<script src="../shared/js/mock-data.js"></script>
<script src="../shared/js/render-helpers.js"></script>
<script>
  initPageChrome('member', 'shop');

  var categories = ['Alle'].concat(Array.from(new Set(MOCK.shopArticles.map(function (a) { return a.kategorie; }))));

  document.getElementById('category-filter').innerHTML = categories.map(function (cat, i) {
    return '<button type="button" class="btn btn-sm ' + (i === 0 ? 'btn-primary' : 'btn-secondary') + '" data-cat="' + cat + '">' + cat + '</button>';
  }).join('');

  function renderArticles(filter) {
    var articles = filter === 'Alle' ? MOCK.shopArticles : MOCK.shopArticles.filter(function (a) { return a.kategorie === filter; });
    document.getElementById('shop-mount').innerHTML = articles.map(function (a) {
      return '<div class="card">' +
        '<div class="shop-article-emoji">' + a.emoji + '</div>' +
        '<div style="font-weight:700;">' + a.name + '</div>' +
        '<div class="shop-price">' + formatPreis(a.preis) + '</div>' +
        '<a class="btn btn-primary btn-sm btn-block" style="margin-top:0.6rem;" href="cart.html">In den Warenkorb</a>' +
      '</div>';
    }).join('');
  }

  document.getElementById('category-filter').addEventListener('click', function (e) {
    var btn = e.target.closest('button');
    if (!btn) return;
    document.querySelectorAll('#category-filter button').forEach(function (b) { b.className = 'btn btn-sm btn-secondary'; });
    btn.className = 'btn btn-sm btn-primary';
    renderArticles(btn.getAttribute('data-cat'));
  });

  renderArticles('Alle');
</script>
</body>
</html>
