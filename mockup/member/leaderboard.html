<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Leaderboard — CrossFit Rheinblick</title>
<link rel="stylesheet" href="../shared/css/base.css">
<link rel="stylesheet" href="../shared/css/layout.css">
<link rel="stylesheet" href="../shared/css/components.css">
<link rel="stylesheet" href="../shared/css/member.css">
</head>
<body>
<div id="page-chrome"></div>
<main class="member-content">
  <div class="container-narrow">
    <h1>Leaderboard</h1>
    <p>CrossFit Rheinblick</p>
    <div class="form-row">
      <label for="scope">Ansicht</label>
      <select id="scope"></select>
    </div>
    <div class="card" id="leaderboard-mount"></div>
  </div>
</main>

<script src="../shared/js/mock-data.js"></script>
<script src="../shared/js/render-helpers.js"></script>
<script>
  initPageChrome('member', 'leaderboard');

  var pastWithPoints = MOCK.courseSessions.filter(function (cs) { return cs.status === 'past' && cs.pointsGiven; });
  var selected = qp('session', 'gesamt');

  var options = '<option value="gesamt">Gesamtrangliste</option>' + pastWithPoints.map(function (cs) {
    var ct = MOCK.getCourseType(cs.courseTypeId);
    return '<option value="' + cs.id + '">' + ct.name + ' · ' + formatDatum(cs.date, cs.weekday) + '</option>';
  }).join('');
  var scopeSelect = document.getElementById('scope');
  scopeSelect.innerHTML = options;
  scopeSelect.value = selected;

  function render(scope) {
    var entries = scope === 'gesamt' ? leaderboardGesamt(CURRENT_TENANT_ID) : leaderboardForSession(scope);
    if (!entries.length) {
      document.getElementById('leaderboard-mount').innerHTML = '<p class="empty-hint">Für diese Auswahl liegen noch keine Punkte vor.</p>';
      return;
    }
    document.getElementById('leaderboard-mount').innerHTML = entries.map(function (row, i) {
      var rank = i + 1;
      var rankClass = rank <= 3 ? ' rank-' + rank : '';
      var isYou = row.user.id === CURRENT_MEMBER_ID;
      return '<div class="leaderboard-row' + (isYou ? ' is-you' : '') + '">' +
        '<div class="leaderboard-rank' + rankClass + '">' + rank + '</div>' +
        avatarHtml(row.user, 36) +
        '<div class="leaderboard-name">' + row.user.name + (isYou ? ' (Du)' : '') + '</div>' +
        '<div class="leaderboard-points">' + row.points + ' Pkt.</div>' +
      '</div>';
    }).join('');
  }

  scopeSelect.addEventListener('change', function () { render(this.value); });
  render(selected);
</script>
</body>
</html>
