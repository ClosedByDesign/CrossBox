<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kursdetail — CrossFit Rheinblick</title>
<link rel="stylesheet" href="../shared/css/base.css">
<link rel="stylesheet" href="../shared/css/layout.css">
<link rel="stylesheet" href="../shared/css/components.css">
<link rel="stylesheet" href="../shared/css/member.css">
</head>
<body>
<div id="page-chrome"></div>
<main class="member-content">
  <div class="container-narrow">
    <a class="back-link" href="dashboard.html">&larr; Zurück zum Kursplan</a>
    <div id="content-mount"></div>
  </div>
</main>

<script src="../shared/js/mock-data.js"></script>
<script src="../shared/js/render-helpers.js"></script>
<script>
  initPageChrome('member', 'dashboard');

  var cs = MOCK.getCourseSession(qp('id')) || MOCK.getCourseSession('cs-5');
  var ct = MOCK.getCourseType(cs.courseTypeId);
  var trainer = MOCK.getUser(ct.trainerId);
  var exercises = MOCK.exercisesFor(cs.id);
  var frei = plaetzeFrei(cs);
  var booked = isCurrentUserBooked(cs);
  var waitlisted = isCurrentUserWaitlisted(cs);

  var exercisesHtml = exercises.length
    ? '<div class="exercise-list">' + exercises.map(function (ex) {
        return '<div class="exercise-item"><span class="exercise-order">' + ex.reihenfolge + '</span>' +
          '<div><strong>' + ex.name + '</strong><div>' + ex.beschreibung + '</div></div></div>';
      }).join('') + '</div>'
    : '<p class="empty-hint">Der Trainer hat die Übungen für diesen Kurs noch nicht veröffentlicht.</p>';

  var actionHtml = '';
  if (cs.status === 'past') {
    actionHtml = cs.pointsGiven
      ? '<a class="btn btn-secondary btn-block" href="leaderboard.html?session=' + cs.id + '">Ergebnisse ansehen</a>'
      : '<p class="empty-hint">Der Trainer hat für diesen Kurs noch keine Punkte vergeben.</p>';
  } else if (cs.status === 'live') {
    actionHtml = booked
      ? '<p class="empty-hint">Dieser Kurs läuft gerade. Die Übungen siehst du oben und auf dem Beamer in der Box.</p>'
      : '<p class="empty-hint">Dieser Kurs hat bereits begonnen und kann nicht mehr gebucht werden.</p>';
  } else if (booked) {
    actionHtml = '<a class="btn btn-danger btn-block" href="success.html?title=' + encodeURIComponent('Abmeldung erfolgreich') +
      '&message=' + encodeURIComponent('Du wurdest von "' + ct.name + '" am ' + formatDatum(cs.date, cs.weekday) + ' abgemeldet.') +
      '&back=dashboard.html&backLabel=' + encodeURIComponent('Zurück zum Kursplan') + '">Kurs absagen</a>';
  } else if (waitlisted) {
    actionHtml = '<a class="btn btn-secondary btn-block" href="success.html?title=' + encodeURIComponent('Von Warteliste entfernt') +
      '&message=' + encodeURIComponent('Du wurdest von der Warteliste für "' + ct.name + '" entfernt.') +
      '&back=dashboard.html&backLabel=' + encodeURIComponent('Zurück zum Kursplan') + '">Von Warteliste entfernen</a>';
  } else if (frei > 0) {
    actionHtml = '<a class="btn btn-primary btn-block" href="success.html?title=' + encodeURIComponent('Einbuchung erfolgreich') +
      '&message=' + encodeURIComponent('Du bist jetzt für "' + ct.name + '" am ' + formatDatum(cs.date, cs.weekday) + ' angemeldet.') +
      '&back=dashboard.html&backLabel=' + encodeURIComponent('Zurück zum Kursplan') + '">Jetzt einbuchen</a>';
  } else {
    actionHtml = '<a class="btn btn-primary btn-block" href="success.html?title=' + encodeURIComponent('Auf Warteliste gesetzt') +
      '&message=' + encodeURIComponent('"' + ct.name + '" ist ausgebucht. Du stehst jetzt auf der Warteliste und rückst automatisch nach, sobald ein Platz frei wird.') +
      '&back=dashboard.html&backLabel=' + encodeURIComponent('Zurück zum Kursplan') + '">Auf Warteliste setzen</a>';
  }

  document.getElementById('content-mount').innerHTML =
    '<div class="page-header"><h1>' + ct.name + '</h1>' + courseStatusBadge(cs) + '</div>' +
    '<p>' + formatDatum(cs.date, cs.weekday) + ' · ' + ct.time + ' Uhr · ' + ct.durationMin + ' Min · Trainer ' + trainer.name + '</p>' +
    '<div class="card" style="margin-bottom:1.25rem;">' +
      '<div class="card-row">' +
        '<span>Teilnehmer</span>' +
        '<strong>' + cs.participantIds.length + ' / ' + MOCK.getCourseType(cs.courseTypeId).maxParticipants + '</strong>' +
      '</div>' +
      (cs.waitlistIds.length ? '<div class="card-row" style="margin-top:0.5rem;"><span>Warteliste</span><strong>' + cs.waitlistIds.length + '</strong></div>' : '') +
    '</div>' +
    '<h2>Übungen</h2>' +
    exercisesHtml +
    '<div style="margin-top:1.75rem;">' + actionHtml + '</div>';
</script>
</body>
</html>
