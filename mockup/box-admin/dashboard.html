<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard — Box-Admin</title>
<link rel="stylesheet" href="../shared/css/base.css">
<link rel="stylesheet" href="../shared/css/layout.css">
<link rel="stylesheet" href="../shared/css/components.css">
<link rel="stylesheet" href="../shared/css/admin.css">
</head>
<body>
<div id="page-chrome"></div>
<div class="admin-shell">
  <aside id="sidebar-chrome" class="admin-sidebar"></aside>
  <main class="admin-main">
    <h1>Dashboard</h1>
    <p class="page-subtitle">Überblick über CrossFit Rheinblick</p>

    <div class="grid grid-3" id="stats-mount" style="margin-bottom:2rem;"></div>

    <div class="section-title">
      <h2>Nächste Kurse</h2>
      <a href="course-types.html">Kursverwaltung &rarr;</a>
    </div>
    <div class="table-wrap" style="margin-bottom:2rem;">
      <table>
        <thead><tr><th>Kurs</th><th>Termin</th><th>Teilnehmer</th><th>Warteliste</th><th></th></tr></thead>
        <tbody id="upcoming-mount"></tbody>
      </table>
    </div>

    <div class="section-title">
      <h2>Vergangene Kurse — Punkte offen</h2>
      <a href="course-types.html">Alle Kurse &rarr;</a>
    </div>
    <div class="table-wrap">
      <table>
        <thead><tr><th>Kurs</th><th>Termin</th><th>Teilnehmer</th><th></th></tr></thead>
        <tbody id="open-points-mount"></tbody>
      </table>
    </div>
  </main>
</div>

<script src="../shared/js/mock-data.js"></script>
<script src="../shared/js/render-helpers.js"></script>
<script>
  initPageChrome('box-admin', 'dashboard');

  var tenantCourseTypeIds = MOCK.courseTypes.filter(function (ct) { return ct.tenantId === CURRENT_TENANT_ID; }).map(function (ct) { return ct.id; });
  var tenantSessions = MOCK.courseSessions.filter(function (cs) { return tenantCourseTypeIds.indexOf(cs.courseTypeId) !== -1; });
  var memberCount = MOCK.users.filter(function (u) { return u.role === 'member' && u.tenantId === CURRENT_TENANT_ID; }).length;
  var todaySessions = tenantSessions.filter(function (cs) { return cs.date === '2026-09-21'; });
  var waitlistTotal = tenantSessions.reduce(function (sum, cs) { return sum + cs.waitlistIds.length; }, 0);

  document.getElementById('stats-mount').innerHTML =
    '<div class="stat-card"><div class="stat-value">' + memberCount + '</div><div class="stat-label">Mitglieder</div></div>' +
    '<div class="stat-card"><div class="stat-value">' + todaySessions.length + '</div><div class="stat-label">Kurse heute</div></div>' +
    '<div class="stat-card"><div class="stat-value">' + waitlistTotal + '</div><div class="stat-label">Auf Wartelisten</div></div>';

  var upcoming = tenantSessions.filter(function (cs) { return cs.status === 'live' || cs.status === 'upcoming'; });
  document.getElementById('upcoming-mount').innerHTML = upcoming.map(function (cs) {
    var ct = MOCK.getCourseType(cs.courseTypeId);
    return '<tr>' +
      '<td>' + ct.name + '</td>' +
      '<td>' + formatDatum(cs.date, cs.weekday) + ', ' + ct.time + '</td>' +
      '<td>' + cs.participantIds.length + ' / ' + ct.maxParticipants + '</td>' +
      '<td>' + (cs.waitlistIds.length || '–') + '</td>' +
      '<td><a href="course-detail.html?id=' + cs.id + '">Übungen &rarr;</a></td>' +
    '</tr>';
  }).join('');

  var openPoints = tenantSessions.filter(function (cs) { return cs.status === 'past' && !cs.pointsGiven; });
  document.getElementById('open-points-mount').innerHTML = openPoints.length
    ? openPoints.map(function (cs) {
        var ct = MOCK.getCourseType(cs.courseTypeId);
        return '<tr>' +
          '<td>' + ct.name + '</td>' +
          '<td>' + formatDatum(cs.date, cs.weekday) + '</td>' +
          '<td>' + cs.participantIds.length + '</td>' +
          '<td><a href="course-session-participants.html?id=' + cs.id + '">Punkte vergeben &rarr;</a></td>' +
        '</tr>';
      }).join('')
    : '<tr><td colspan="4" class="empty-hint">Für alle vergangenen Kurse wurden bereits Punkte vergeben.</td></tr>';
</script>
</body>
</html>
