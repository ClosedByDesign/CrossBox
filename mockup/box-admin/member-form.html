<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mitglied bearbeiten — Box-Admin</title>
<link rel="stylesheet" href="../shared/css/base.css">
<link rel="stylesheet" href="../shared/css/layout.css">
<link rel="stylesheet" href="../shared/css/components.css">
<link rel="stylesheet" href="../shared/css/admin.css">
</head>
<body>
<div id="page-chrome"></div>
<div class="admin-shell">
  <aside id="sidebar-chrome" class="admin-sidebar"></aside>
  <main class="admin-main">
    <a class="back-link" href="members.html">&larr; Zurück zur Mitgliederliste</a>
    <h1 id="form-title">Neues Mitglied</h1>

    <div class="card" style="max-width:520px;">
      <form action="success.html" method="get">
        <input type="hidden" name="back" value="members.html">
        <input type="hidden" name="backLabel" value="Zurück zur Mitgliederliste">
        <input type="hidden" name="title" value="Mitglied gespeichert">

        <div class="profile-avatar-row">
          <span class="avatar" id="avatar-preview" style="width:56px;height:56px;font-size:1.1rem;background:#33373f;">?</span>
          <button type="button" class="btn btn-secondary btn-sm" disabled>Bild ändern (Demo)</button>
        </div>

        <div class="form-row">
          <label for="name">Name</label>
          <input type="text" id="name" name="name" placeholder="Vorname Nachname">
        </div>
        <div class="form-row">
          <label for="nickname">Nickname</label>
          <input type="text" id="nickname" name="nickname" placeholder="z.B. annab">
        </div>
        <div class="form-row">
          <label for="email">E-Mail</label>
          <input type="email" id="email" name="email" placeholder="name@example.com">
        </div>
        <div class="form-row">
          <label for="status">Status</label>
          <select id="status" name="status">
            <option value="aktiv">Aktiv</option>
            <option value="inaktiv">Inaktiv</option>
          </select>
        </div>

        <div class="form-actions">
          <button type="submit" class="btn btn-primary">Speichern</button>
          <a class="btn btn-secondary" href="members.html">Abbrechen</a>
        </div>
        <input type="hidden" name="message" id="message-field" value="Das Mitglied wurde gespeichert.">
      </form>
    </div>
  </main>
</div>

<script src="../shared/js/mock-data.js"></script>
<script src="../shared/js/render-helpers.js"></script>
<script>
  initPageChrome('box-admin', 'members');

  var user = MOCK.getUser(qp('id'));
  if (user) {
    document.getElementById('form-title').textContent = 'Mitglied bearbeiten';
    document.getElementById('name').value = user.name;
    document.getElementById('nickname').value = user.nickname;
    document.getElementById('email').value = user.email;
    document.getElementById('avatar-preview').textContent = initials(user.name);
    document.getElementById('avatar-preview').style.background = user.avatarColor;
    document.getElementById('message-field').value = '"' + user.name + '" wurde aktualisiert.';
  }

  document.querySelector('form').addEventListener('submit', function () {
    var name = document.getElementById('name').value || 'Neues Mitglied';
    if (!user) {
      document.getElementById('message-field').value = '"' + name + '" wurde als neues Mitglied angelegt.';
    }
  });
</script>
</body>
</html>
