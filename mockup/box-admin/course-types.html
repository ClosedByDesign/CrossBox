<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kursverwaltung — Box-Admin</title>
<link rel="stylesheet" href="../shared/css/base.css">
<link rel="stylesheet" href="../shared/css/layout.css">
<link rel="stylesheet" href="../shared/css/components.css">
<link rel="stylesheet" href="../shared/css/admin.css">
</head>
<body>
<div id="page-chrome"></div>
<div class="admin-shell">
  <aside id="sidebar-chrome" class="admin-sidebar"></aside>
  <main class="admin-main">
    <div class="page-header">
      <div>
        <h1>Kursverwaltung</h1>
        <p class="page-subtitle">Wiederkehrende Kurstypen deiner Box</p>
      </div>
      <a class="btn btn-primary" href="course-type-form.html">+ Neuer Kurstyp</a>
    </div>

    <div class="table-wrap">
      <table>
        <thead><tr><th>Kurs</th><th>Wochentag(e)</th><th>Uhrzeit</th><th>Max. Teilnehmer</th><th>Trainer</th><th>Nächster Termin</th><th></th></tr></thead>
        <tbody id="course-types-mount"></tbody>
      </table>
    </div>
  </main>
</div>

<script src="../shared/js/mock-data.js"></script>
<script src="../shared/js/render-helpers.js"></script>
<script>
  initPageChrome('box-admin', 'course-types');

  var courseTypes = MOCK.courseTypes.filter(function (ct) { return ct.tenantId === CURRENT_TENANT_ID; });
  document.getElementById('course-types-mount').innerHTML = courseTypes.map(function (ct) {
    var trainer = MOCK.getUser(ct.trainerId);
    var nextSession = MOCK.courseSessions.find(function (cs) {
      return cs.courseTypeId === ct.id && (cs.status === 'live' || cs.status === 'upcoming');
    });
    var nextCell = nextSession
      ? '<a href="course-detail.html?id=' + nextSession.id + '">' + formatDatum(nextSession.date, nextSession.weekday) + '</a>'
      : '<span class="empty-hint">kein Termin</span>';
    return '<tr>' +
      '<td>' + ct.name + '</td>' +
      '<td>' + ct.weekdays.join(', ') + '</td>' +
      '<td>' + ct.time + ' Uhr</td>' +
      '<td>' + ct.maxParticipants + '</td>' +
      '<td>' + trainer.name + '</td>' +
      '<td>' + nextCell + '</td>' +
      '<td><a href="course-type-form.html?id=' + ct.id + '">Bearbeiten</a></td>' +
    '</tr>';
  }).join('');
</script>
</body>
</html>
