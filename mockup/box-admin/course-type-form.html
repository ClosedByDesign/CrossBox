<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kurstyp bearbeiten — Box-Admin</title>
<link rel="stylesheet" href="../shared/css/base.css">
<link rel="stylesheet" href="../shared/css/layout.css">
<link rel="stylesheet" href="../shared/css/components.css">
<link rel="stylesheet" href="../shared/css/admin.css">
</head>
<body>
<div id="page-chrome"></div>
<div class="admin-shell">
  <aside id="sidebar-chrome" class="admin-sidebar"></aside>
  <main class="admin-main">
    <a class="back-link" href="course-types.html">&larr; Zurück zur Kursverwaltung</a>
    <h1 id="form-title">Neuer Kurstyp</h1>

    <div class="card" style="max-width:560px;">
      <form action="success.html" method="get">
        <input type="hidden" name="back" value="course-types.html">
        <input type="hidden" name="backLabel" value="Zurück zur Kursverwaltung">
        <input type="hidden" name="title" value="Kurstyp gespeichert">
        <input type="hidden" name="message" id="message-field" value="Der Kurstyp wurde gespeichert.">

        <div class="form-row">
          <label for="name">Name</label>
          <input type="text" id="name" name="name" placeholder="z.B. WOD">
        </div>

        <div class="form-row">
          <label>Wochentag(e)</label>
          <div class="weekday-picker">
            <label><input type="checkbox" name="weekday" value="Montag"> Mo</label>
            <label><input type="checkbox" name="weekday" value="Dienstag"> Di</label>
            <label><input type="checkbox" name="weekday" value="Mittwoch"> Mi</label>
            <label><input type="checkbox" name="weekday" value="Donnerstag"> Do</label>
            <label><input type="checkbox" name="weekday" value="Freitag"> Fr</label>
            <label><input type="checkbox" name="weekday" value="Samstag"> Sa</label>
            <label><input type="checkbox" name="weekday" value="Sonntag"> So</label>
          </div>
        </div>

        <div class="grid grid-2">
          <div class="form-row">
            <label for="time">Uhrzeit</label>
            <input type="time" id="time" name="time" value="18:00">
          </div>
          <div class="form-row">
            <label for="duration">Dauer (Minuten)</label>
            <input type="number" id="duration" name="duration" value="60" min="15" step="5">
          </div>
        </div>

        <div class="grid grid-2">
          <div class="form-row">
            <label for="max">Max. Teilnehmerzahl</label>
            <input type="number" id="max" name="max" value="12" min="1">
          </div>
          <div class="form-row">
            <label for="trainer">Trainer</label>
            <select id="trainer" name="trainer">
              <option value="u-admin-1">Petra Vogel</option>
            </select>
          </div>
        </div>

        <div class="form-actions">
          <button type="submit" class="btn btn-primary">Speichern</button>
          <a class="btn btn-secondary" href="course-types.html">Abbrechen</a>
        </div>
      </form>
    </div>
  </main>
</div>

<script src="../shared/js/mock-data.js"></script>
<script src="../shared/js/render-helpers.js"></script>
<script>
  initPageChrome('box-admin', 'course-types');

  var ct = MOCK.getCourseType(qp('id'));
  if (ct) {
    document.getElementById('form-title').textContent = 'Kurstyp bearbeiten';
    document.getElementById('name').value = ct.name;
    document.getElementById('time').value = ct.time;
    document.getElementById('duration').value = ct.durationMin;
    document.getElementById('max').value = ct.maxParticipants;
    document.querySelectorAll('input[name="weekday"]').forEach(function (cb) {
      cb.checked = ct.weekdays.indexOf(cb.value) !== -1;
    });
    document.getElementById('message-field').value = 'Der Kurstyp "' + ct.name + '" wurde aktualisiert.';
  }

  document.querySelector('form').addEventListener('submit', function () {
    var name = document.getElementById('name').value || 'Neuer Kurstyp';
    if (!ct) {
      document.getElementById('message-field').value = 'Der Kurstyp "' + name + '" wurde angelegt.';
    }
  });
</script>
</body>
</html>
