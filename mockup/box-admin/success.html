<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Erledigt — Box-Admin</title>
<link rel="stylesheet" href="../shared/css/base.css">
<link rel="stylesheet" href="../shared/css/layout.css">
<link rel="stylesheet" href="../shared/css/components.css">
<link rel="stylesheet" href="../shared/css/admin.css">
</head>
<body>
<div id="page-chrome"></div>
<div class="admin-shell">
  <aside id="sidebar-chrome" class="admin-sidebar"></aside>
  <main class="admin-main">
    <div class="success-box" style="max-width:480px;margin:0 auto;">
      <div class="success-icon">✓</div>
      <h1 id="success-title">Erledigt</h1>
      <p id="success-message"></p>
      <a id="success-back" class="btn btn-primary" href="dashboard.html">Zurück</a>
    </div>
  </main>
</div>

<script src="../shared/js/mock-data.js"></script>
<script src="../shared/js/render-helpers.js"></script>
<script>
  initPageChrome('box-admin', '');
  document.getElementById('success-title').textContent = qp('title', 'Erledigt');
  document.getElementById('success-message').textContent = qp('message', 'Deine Änderung wurde übernommen.');
  var back = document.getElementById('success-back');
  back.href = qp('back', 'dashboard.html');
  back.textContent = qp('backLabel', 'Zurück');
</script>
</body>
</html>
